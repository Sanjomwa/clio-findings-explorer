slug: finance-bill-2024
week_start_date: 2024-06-22
iso2: KE
position: 1
title: "22–28 June 2024: protest and suppression both SEVERE"
teaser: "CLIO's first CRISIS week of the 2024 Finance Bill protests, the week protesters entered Kenya's Parliament buildings."
summary_md: |
  In the week of 22–28 June 2024, CLIO classified Kenya as CRISIS with HIGH confidence. Protest (z = 2.01) and suppression (z = 2.31) were both SEVERE against their own previous 12 weeks, and violence was ELEVATED (z = 1.44). ACLED recorded 167 events that week, against a median of 55 in the 12 weeks before.

  The week before was held at STABLE as a first qualifying week toward CONTESTATION, with protest ELEVATED and suppression SEVERE. CRISIS was held for the two weeks after this one, as leaving CRISIS takes three consecutive lower weeks; the week of 13 July 2024 was STABLE.

  On 25 June 2024, protesters opposing the Finance Bill 2024 entered Kenya's Parliament buildings in Nairobi, and part of the building was on fire. The same day, an internet disruption was recorded in Kenya; its cause is disputed. On 26 June 2024, President Ruto said he would not sign the bill.

  In OONI's measurements for the week, Signal's anomaly rate had the highest z-score against its own 12-week baseline, at 1.24. Google's government-requests report lists 9 removal requests from Kenya for January to June 2024.
published_at: 2026-10-14T12:00:00+03:00
caveats:
  - severity: limitation
    caveat_md: "ACLED data are the classification's own input, so the ACLED card is not independent confirmation of the CRISIS label."
  - severity: limitation
    caveat_md: "OONI's Signal test checks whether Signal's servers can be reached from the tester's network. OONI's own resources point to IODA and similar tools for monitoring internet connectivity shutdowns. This finding treats OONI data as evidence neither for nor against the 25 June disruption."
  - severity: limitation
    caveat_md: "Google's figure covers the whole half-year, not this week."
  - severity: do_not_conclude
    caveat_md: "Do not conclude that the protests, the internet disruption and the OONI measurements are connected. This finding records only that they fall in the same week."
