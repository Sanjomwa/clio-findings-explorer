title: "15–21 July 2023: CRISIS, with OONI signals flat"
teaser: "Protest and suppression were both SEVERE in the week the opposition began three days of protests, while OONI's tests stayed close to their baselines."
key_phrase: "while OONI's tests stayed close to their baselines"
summary_md: |
  In the week of 15–21 July 2023, CLIO classified Kenya as CRISIS with HIGH confidence. Protest (z = 3.14) and suppression (z = 2.12) were both SEVERE against their own previous 12 weeks, while violence was NORMAL (z = −1.15). ACLED recorded 103 events that week, against a median of 49.5 in the 12 weeks before.

  The week before was held at STABLE as a first qualifying week toward CONTESTATION, with protest SEVERE and suppression ELEVATED. CRISIS was held for the two weeks after this one, as leaving CRISIS takes three consecutive lower weeks; the week of 5 August 2023 was STABLE.

  On 19 July 2023, the opposition Azimio la Umoja alliance, led by Raila Odinga, began three days of anti-government protests it had called over tax rises in the new finance law and the cost of living. At least 300 people were arrested on 19 July 2023.

  In OONI's measurements for the week, WhatsApp's anomaly rate had the highest z-score against its own 12-week baseline, at 0.02: 1 of 232 WhatsApp measurements was anomalous, and none of 124 Signal measurements were. Google's government-requests report lists 5 removal requests from Kenya for July to December 2023.
published_at: 2026-10-14T16:00:00+03:00
caveats:
  - severity: limitation
    caveat_md: "ACLED data are the classification's own input, so the ACLED card is not independent confirmation of the CRISIS label."
  - severity: limitation
    caveat_md: "OONI's WhatsApp test checks whether WhatsApp's app and web version can be reached from the tester's network, and its Signal test does the same for Signal's servers. OONI's own resources point to IODA and similar tools for monitoring internet connectivity shutdowns. Flat OONI figures are not evidence that nothing was restricted this week."
  - severity: limitation
    caveat_md: "Google's figure covers the whole half-year, not this week."
  - severity: do_not_conclude
    caveat_md: "Do not conclude that the protests and the CRISIS label are connected beyond falling in the same week, or that flat OONI figures show there was no interference. This finding records only that these coincide in time."
