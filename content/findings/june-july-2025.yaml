title: "21–27 June 2025: STABLE, with Telegram far above its baseline"
teaser: "The anniversary week of the 2024 protests read STABLE with HIGH confidence, while OONI's Telegram test was 10.17 standard deviations above its baseline."
summary_md: |
  In the week of 21–27 June 2025, CLIO classified Kenya as STABLE with HIGH confidence. Suppression was ELEVATED (z = 1.21), while protest (z = 0.62) and violence (z = −0.07) were NORMAL. ACLED recorded 115 events that week, against a median of 61.5 in the 12 weeks before.

  With suppression the only family raised, the week was a first qualifying week toward REPRESSION. The next week was not raised, so REPRESSION was not assigned. The same happened in the week of 5 July 2025, when suppression was SEVERE (z = 2.74). Entering REPRESSION needs two consecutive qualifying weeks.

  The two weeks before were ESCALATION: protest was SEVERE (z = 2.03) in the week of 7 June 2025, and the week of 14 June 2025 was held at ESCALATION, as leaving it takes two consecutive lower weeks. Both weeks are in this week's 12-week baseline.

  On 25 June 2025, protests took place across Kenya marking one year since the 25 June 2024 protests. The same day, OONI found Telegram's web service blocked on at least three Kenyan networks, two of them Safaricom's; the block was lifted the same day. The Communications Authority ordered television and radio stations to stop live coverage of the protests, and the High Court suspended that order the same day.

  In OONI's measurements for the week, Telegram's anomaly rate had the highest z-score against its own 12-week baseline, at 10.17: 54 of 789 Telegram measurements were anomalous. Google's government-requests report lists 16 removal requests from Kenya for January to June 2025.
published_at: 2026-10-14T15:00:00+03:00
caveats:
  - severity: limitation
    caveat_md: "ACLED data are the classification's own input, so the ACLED card is not independent confirmation of the STABLE label."
  - severity: limitation
    caveat_md: "A STABLE label means no regime rule was met this week; it does not mean nothing happened. Bands can still be raised, and this week's suppression band was."
  - severity: limitation
    caveat_md: "OONI reported the block on Telegram's web service, not the Telegram mobile app. The snapshot's weekly OONI figure does not show which networks or hours were affected."
  - severity: limitation
    caveat_md: "Google's figure covers the whole half-year, not this week."
  - severity: do_not_conclude
    caveat_md: "Do not conclude that the protests, the Telegram block, the broadcast order and the OONI figure are connected, or that a STABLE label means the week was calm. This finding records only what fell in the same week and how CLIO's rules classified it."
