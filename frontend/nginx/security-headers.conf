# Browser security headers. Included by the server block AND by every location that has its own
# add_header: nginx drops all inherited add_header lines in a location that sets any of its own.
# `always` makes them apply to error responses (404, 429, 502) too.
#
# Copied as a plain file (not a .template), so envsubst never touches it.
#
# The script-src hash is sha256 of the inline theme script in frontend/index.html, the exact
# bytes between <script> and </script>. Change that script and this hash must change with it;
# ops/tests/test_security_headers.py fails if they differ.
#
# font-src has `data:` because Vite inlines the small font files into the CSS as data: URLs.
# style-src has no 'unsafe-inline': React's style={...} props are set through the DOM (CSSOM),
# which style-src does not block.
#
# No Strict-Transport-Security here: the .app TLD is on the browsers' HSTS preload list already,
# and local compose runs on plain http, where the header is ignored or harmful.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-+jkZcjw5qt+IDTUf4L81D1bJ8oblyR5ybaDjlHxgkfw='; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
