[project]
name = "findings-explorer-tools"
version = "0.1.0"
description = "Read-only MCP server for the CLIO Findings Explorer repository (spec_lookup)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.2,<2",
    "psycopg[binary]>=3",
    "pyyaml>=6",
    "sqlglot>=30.22.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs the compose Postgres db service (skipped when unreachable)"]
