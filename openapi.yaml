openapi: 3.1.0
info:
  title: CLIO Findings Explorer API
  version: 0.4.1
  summary: Read-only API for curated Kenya civil-liberties findings.
  description: |
    Contract for the CLIO Findings Explorer backend. This file is hand-authored and is the
    source of truth: it is edited first, in its own commit, before any router or frontend
    code that depends on the change.

    All endpoints are read-only and need no authentication. Data comes from a versioned,
    committed snapshot of CLIO output loaded into Postgres. The API never calls BigQuery.

    Status of this version (v0.4.1, 2026-10-11, after snapshot 2026-10-10.1; changes from
    v0.4.0: `/api/findings` is ordered by curated position, the ACLED prior-12-week medians
    are nullable, and the seven non-health operations document a 503 for "no snapshot is
    loaded"):
    paths, parameters and envelope fields are settled, and so are regime states, confidence
    levels and family bands. The evidence-card shapes are now fixed: each card's headline,
    comparison and `supporting` object are defined, and each evidence operation states how
    its numbers are derived. Still PROVISIONAL, and marked `x-provisional`: only the
    per-source fields in `/api/methodology` (`SourceNote`).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080
    description: Local Docker Compose (frontend nginx proxies /api to the backend)
  - url: http://localhost:8000
    description: Backend directly, local development
tags:
  - name: system
    description: Health and methodology
  - name: timeline
    description: Weekly regime classification series
  - name: findings
    description: Curated findings and their evidence cards
paths:
  /api/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness and readiness
      description: |
        Reports whether the database is reachable, which migration is applied, which
        snapshot is loaded and how many rows each table holds. Returns 503 with the same
        body shape when the database is unreachable or the snapshot is not loaded.
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Service is running but not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/timeline:
    get:
      tags: [timeline]
      operationId: getTimeline
      summary: Weekly regime series for the timeline strip
      description: |
        Series of classified weeks, oldest first. "Sparse" means only weeks that exist
        in the snapshot are returned; missing weeks are not filled in. A week carries
        `finding_slug` when a curated finding exists for it.

        Edge cases: a country with no data returns 200 with an empty `weeks` array.
        `from` later than `to` returns 200 with an empty `weeks` array. `state` simply
        filters the returned weeks. A malformed parameter returns 422.
      parameters:
        - name: country
          in: query
          description: ISO 3166-1 alpha-2 country code.
          schema:
            type: string
            pattern: "^[A-Z]{2}$"
            default: KE
        - name: from
          in: query
          description: Earliest week start date to include (inclusive).
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Latest week start date to include (inclusive).
          schema:
            type: string
            format: date
        - name: state
          in: query
          description: Return only weeks in this regime state.
          schema:
            $ref: "#/components/schemas/RegimeState"
      responses:
        "200":
          description: The weekly series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/NoSnapshot"
  /api/findings:
    get:
      tags: [findings]
      operationId: listFindings
      summary: List curated findings
      description: |
        Ordered by curated position (`findings.position`, set in the curated content), not by
        week.
      responses:
        "200":
          description: All curated findings, ordered by curated position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingListResponse"
        "503":
          $ref: "#/components/responses/NoSnapshot"
  /api/findings/{slug}:
    get:
      tags: [findings]
      operationId: getFinding
      summary: One finding in full
      description: |
        Title, classification badges, plain-language summary, caveats and sources.
        `caveats` is never empty: a finding with no caveat cannot be stored or served.
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The finding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/NoSnapshot"
  /api/findings/{slug}/evidence/acled:
    get:
      tags: [findings]
      operationId: getAcledEvidence
      summary: ACLED conflict-event evidence card
      description: |
        Evidence card for the finding's anchor week, computed at request time from the
        `acled_signal_context` snapshot table.

        The source is the classifier's own input, so this card is not independent
        corroboration of the classification.

        - Headline: "Conflict events recorded in the week (all event types)". `metric_value` is
          `total_events` for the anchor week.
        - Comparison: label "Median of the 12 weeks before", value the median of `total_events`
          over the 12 weeks immediately before the anchor week. If the snapshot has no earlier
          weeks than the anchor, `comparison` is null.
        - Period: `period_start` is the anchor date, `period_end` is the anchor date plus 6
          days, `period_grain` is `week`.
        - `has_data` is false only if the anchor week has no row.
        - `supporting.series` holds the anchor's 17-week window, from 12 weeks before the anchor
          to 4 weeks after it, oldest first.
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The ACLED evidence card for this finding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceCardResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/NoSnapshot"
  /api/findings/{slug}/evidence/ooni:
    get:
      tags: [findings]
      operationId: getOoniEvidence
      summary: OONI internet-measurement evidence card
      description: |
        Evidence card for the finding's anchor week, computed at request time from the
        `ooni_weekly_signals` snapshot table (one row per test per week).

        - Over the anchor week's rows, the card picks the test with the highest non-null
          `anomalous_zscore_12w`. Ties are broken by `test_name`, alphabetically.
        - Headline: "Anomalous measurement rate, for the test furthest above its own 12-week
          baseline". `metric_value` is that test's `anomalous_rate`.
        - Comparison: label "<test_name>: standard deviations from its own 12-week baseline",
          value that test's z-score.
        - If every z-score in the week is null, `metric_value` and `comparison` are null,
          `has_data` stays true, and the provenance note says no baseline was available.
        - `has_data` is false when the anchor week has no OONI rows. OONI weekly signals cover
          only 2023-05-27 to 2025-06-28.
        - Period: the anchor week (`period_start` the anchor date, `period_end` that plus 6
          days), `period_grain` `week`.
        - The contract sets no threshold: the card reports the number and its baseline
          comparison and does not label any value as normal or abnormal.
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The OONI evidence card for this finding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceCardResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/NoSnapshot"
  /api/findings/{slug}/evidence/google-transparency:
    get:
      tags: [findings]
      operationId: getGoogleTransparencyEvidence
      summary: Google Transparency Report evidence card
      description: |
        Evidence card computed at request time from the `google_transparency_requests` snapshot
        table. Google reports per half-year, so the card covers the half-year containing the
        finding's anchor week: 1 Jan to 30 Jun, or 1 Jul to 31 Dec. In the snapshot that
        half-year's `period_date` is `YYYY-06-01` or `YYYY-12-01`.

        - Headline: "Removal requests in Google's government-requests report for Kenya, this
          half-year". `metric_value` is the sum of `number_of_requests` over that half-year's
          rows.
        - Comparison: null.
        - Period: `period_start` and `period_end` are the half-year's first and last day,
          `period_grain` is `half_year`.
        - `has_data` is false when the snapshot has no rows for that half-year. The provenance
          note then says the snapshot has no rows for that period; it never claims zero
          requests. For periods before July 2012 it says the snapshot's Google data begins with
          July to December 2012.
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The Google Transparency Report evidence card for this finding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceCardResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/NoSnapshot"
  /api/methodology:
    get:
      tags: [system]
      operationId: getMethodology
      summary: Classification scheme, source notes and snapshot manifest
      responses:
        "200":
          description: The methodology page content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MethodologyResponse"
        "503":
          $ref: "#/components/responses/NoSnapshot"
components:
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: Finding identifier, for example `finance-bill-2024`.
      schema:
        type: string
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        maxLength: 80
  responses:
    NotFound:
      description: |
        No finding has this slug. This is the only meaning of 404. A finding that exists
        but has no data from a source returns 200 with `has_data: false`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoSnapshot:
      description: No snapshot is loaded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: A path or query parameter is malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
  schemas:
    RegimeState:
      type: string
      description: |
        CLIO regime classification for a country-week. CLIO defines seven states; in snapshot
        2026-10-10.1 (Kenya) CONTESTATION and REPRESSION never occur.
      enum: [STABLE, MOBILISATION, CONTESTATION, ESCALATION, CRISIS, REPRESSION, CONFLICT]
    ConfidenceLevel:
      type: string
      description: |
        CLIO's confidence in the week's classification. LOW is defined by CLIO but does not
        occur in snapshot 2026-10-10.1.
      enum: [HIGH, MEDIUM, LOW, INSUFFICIENT_DATA]
    FamilyBand:
      type: string
      description: |
        Band for one pressure family (protest, violence or suppression) relative to its own
        baseline. UNKNOWN means the baseline could not support a band.
      enum: [NORMAL, ELEVATED, SEVERE, UNKNOWN]
    WeekClassification:
      type: object
      required:
        - protest_band
        - violence_band
        - suppression_band
        - previous_regime
        - pre_transition_target
      properties:
        protest_band:
          $ref: "#/components/schemas/FamilyBand"
        violence_band:
          $ref: "#/components/schemas/FamilyBand"
        suppression_band:
          $ref: "#/components/schemas/FamilyBand"
        previous_regime:
          $ref: "#/components/schemas/RegimeState"
        pre_transition_target:
          description: |
            Set when the week met the conditions for this state for the first time and is held
            at its current state until a second consecutive qualifying week. Parsed from
            `pre_transition:<STATE>` in CLIO's classification_reason; null when absent. The raw
            classification_reason is not served, because its sub-labels do not describe the
            bands.
          oneOf:
            - $ref: "#/components/schemas/RegimeState"
            - type: "null"
    EvidenceSource:
      type: string
      enum: [acled, ooni, google_transparency]
    CaveatSeverity:
      type: string
      description: |
        `limitation` states what the evidence cannot show. `do_not_conclude` names a
        specific inference the reader must not draw.
      enum: [limitation, do_not_conclude]
    SnapshotVersion:
      type: string
      description: Version of the loaded snapshot, from `data/snapshot/MANIFEST.json`.
      examples: ["2026-10-10.1"]
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: Human-readable reason.
    ValidationError:
      type: object
      description: FastAPI's default request-validation body, kept as is.
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            required: [loc, msg, type]
            properties:
              loc:
                type: array
                items:
                  type: [string, integer]
              msg:
                type: string
              type:
                type: string
            additionalProperties: true
    Health:
      type: object
      required: [status, database, snapshot_version, migration_head, row_counts]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [reachable, unreachable]
        snapshot_version:
          oneOf:
            - $ref: "#/components/schemas/SnapshotVersion"
            - type: "null"
        migration_head:
          type: [string, "null"]
          description: Alembic revision currently applied.
        row_counts:
          type: object
          description: Row count per table. Empty when the database is unreachable.
          additionalProperties:
            type: integer
            minimum: 0
    TimelineWeek:
      type: object
      required: [week_start_date, country_iso, regime_state, confidence_level, finding_slug]
      properties:
        week_start_date:
          type: string
          format: date
        country_iso:
          type: string
          pattern: "^[A-Z]{2}$"
        regime_state:
          $ref: "#/components/schemas/RegimeState"
        confidence_level:
          $ref: "#/components/schemas/ConfidenceLevel"
        finding_slug:
          type: [string, "null"]
          description: Slug of the curated finding for this week, if one exists.
    TimelineResponse:
      type: object
      required: [snapshot_version, country, weeks]
      properties:
        snapshot_version:
          $ref: "#/components/schemas/SnapshotVersion"
        country:
          type: string
          pattern: "^[A-Z]{2}$"
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/TimelineWeek"
    FindingSummary:
      type: object
      required: [slug, title, week_start_date, country_iso, regime_state, confidence_level, teaser]
      properties:
        slug:
          type: string
        title:
          type: string
        week_start_date:
          type: string
          format: date
        country_iso:
          type: string
          pattern: "^[A-Z]{2}$"
        regime_state:
          $ref: "#/components/schemas/RegimeState"
        confidence_level:
          $ref: "#/components/schemas/ConfidenceLevel"
        teaser:
          type: string
          description: One line of plain text for the list view.
    FindingListResponse:
      type: object
      required: [snapshot_version, findings]
      properties:
        snapshot_version:
          $ref: "#/components/schemas/SnapshotVersion"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/FindingSummary"
    Caveat:
      type: object
      required: [severity, caveat_md]
      properties:
        severity:
          $ref: "#/components/schemas/CaveatSeverity"
        caveat_md:
          type: string
          description: Markdown text of the caveat.
    SourceRef:
      type: object
      required: [source, name, provenance_note]
      properties:
        source:
          $ref: "#/components/schemas/EvidenceSource"
        name:
          type: string
          description: Display name of the source.
        provenance_note:
          type: string
        url:
          type: string
          format: uri
    FindingDetail:
      type: object
      required:
        - slug
        - title
        - week_start_date
        - country_iso
        - regime_state
        - confidence_level
        - classification
        - summary_md
        - caveats
        - sources
        - evidence_available
        - published_at
      properties:
        slug:
          type: string
        title:
          type: string
        week_start_date:
          type: string
          format: date
        country_iso:
          type: string
          pattern: "^[A-Z]{2}$"
        regime_state:
          $ref: "#/components/schemas/RegimeState"
        confidence_level:
          $ref: "#/components/schemas/ConfidenceLevel"
        classification:
          $ref: "#/components/schemas/WeekClassification"
        summary_md:
          type: string
          description: Plain-language summary, in Markdown.
        caveats:
          type: array
          minItems: 1
          description: Ordered caveats. Never empty.
          items:
            $ref: "#/components/schemas/Caveat"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceRef"
        evidence_available:
          type: array
          description: |
            Sources whose evidence card has data for this finding (`has_data` true).
            Every source still returns a card.
          items:
            $ref: "#/components/schemas/EvidenceSource"
        published_at:
          type: string
          format: date-time
    FindingDetailResponse:
      type: object
      required: [snapshot_version, finding]
      properties:
        snapshot_version:
          $ref: "#/components/schemas/SnapshotVersion"
        finding:
          $ref: "#/components/schemas/FindingDetail"
    EvidenceCard:
      type: object
      required:
        - slug
        - source
        - has_data
        - period_start
        - period_end
        - period_grain
        - headline_metric
        - metric_value
        - comparison
        - provenance_note
        - snapshot_files
        - supporting
      properties:
        slug:
          type: string
        source:
          $ref: "#/components/schemas/EvidenceSource"
          description: |
            Note the spelling: the enum value is `google_transparency`, the URL segment
            is `google-transparency`.
        has_data:
          type: boolean
          description: |
            False when this source has no data for the finding's window, for example a
            week before the source began collecting. The card is still returned, with
            `metric_value` null and a `provenance_note` that says why.
        period_start:
          type: [string, "null"]
          format: date
          description: First day of the period the numbers cover. Null when `has_data` is false.
        period_end:
          type: [string, "null"]
          format: date
          description: Last day of the period the numbers cover. Null when `has_data` is false.
        period_grain:
          type: string
          description: |
            Reporting grain of this source. It is not always a week: a source that
            reports per half-year covers a much longer period than the finding's week,
            and the UI must show that.
          enum: [week, month, half_year, other]
        headline_metric:
          type: string
          description: Label of the single number the card leads with.
        metric_value:
          type: [number, string, "null"]
          description: The headline value. Null when the source has no data for the window.
        comparison:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/EvidenceComparison"
          description: |
            The figure the headline is set against, or null when the source gives none.
            How it is derived is stated in each evidence operation's description.
        provenance_note:
          type: string
          description: Where the numbers come from and what window they cover.
        snapshot_files:
          type: array
          items:
            type: string
          description: |
            Files in `data/snapshot/` (and so tables in `MANIFEST.json`) that the card's
            numbers come from.
        supporting:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/AcledSupporting"
            - $ref: "#/components/schemas/OoniSupporting"
            - $ref: "#/components/schemas/GoogleTransparencySupporting"
          description: |
            Source-specific detail behind the headline; the `kind` field says which
            shape it is. Null when `has_data` is false.
    EvidenceComparison:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: number
    AcledSignalWeek:
      type: object
      description: One row of the `acled_signal_context` snapshot table.
      required:
        - week_start_date
        - total_events
        - total_fatalities
        - signal_valid
        - protest_pressure_z
        - violence_pressure_z
        - suppression_z
        - protest_active_baseline_weeks
        - violence_active_baseline_weeks
        - suppression_active_baseline_weeks
        - sparse_protest_baseline_flag
        - sparse_violence_baseline_flag
        - sparse_suppression_baseline_flag
        - zero_variance_flag
        - low_event_density_flag
        - high_methodology_risk_flag
      properties:
        week_start_date:
          type: string
          format: date
        total_events:
          type: integer
        total_fatalities:
          type: integer
        signal_valid:
          type: boolean
        protest_pressure_z:
          type: [number, "null"]
        violence_pressure_z:
          type: [number, "null"]
        suppression_z:
          type: [number, "null"]
        protest_active_baseline_weeks:
          type: integer
        violence_active_baseline_weeks:
          type: integer
        suppression_active_baseline_weeks:
          type: integer
        sparse_protest_baseline_flag:
          type: boolean
        sparse_violence_baseline_flag:
          type: boolean
        sparse_suppression_baseline_flag:
          type: boolean
        zero_variance_flag:
          type: boolean
        low_event_density_flag:
          type: boolean
        high_methodology_risk_flag:
          type: boolean
    AcledSupporting:
      type: object
      required:
        - kind
        - classifier_input
        - week
        - prior_12_week_median_events
        - prior_12_week_median_fatalities
        - series
      properties:
        kind:
          const: acled
        classifier_input:
          const: true
          description: |
            This source is the classification's own input, so it is not independent
            corroboration of the classification.
        week:
          $ref: "#/components/schemas/AcledSignalWeek"
        prior_12_week_median_events:
          type: [number, "null"]
          description: |
            Median of `total_events` over the 12 weeks before the anchor week. Null when the
            anchor has no earlier weeks in the snapshot.
        prior_12_week_median_fatalities:
          type: [number, "null"]
          description: |
            Median of `total_fatalities` over the 12 weeks before the anchor week. Null when
            the anchor has no earlier weeks in the snapshot.
        series:
          type: array
          description: |
            The anchor's 17-week window: the 12 weeks before the anchor, the anchor, then
            the 4 weeks after, oldest first. This is the rule in `finding_anchors` in
            `data/snapshot/MANIFEST.json`.
          items:
            $ref: "#/components/schemas/AcledSignalWeek"
    OoniTestWeek:
      type: object
      description: One row of the `ooni_weekly_signals` snapshot table (one test, one week).
      required:
        - week_start_date
        - test_name
        - anomalous_total_scored
        - anomalous_count
        - anomalous_rate
        - anomalous_baseline_rate_12w
        - anomalous_zscore_12w
        - anomalous_low_sample_flag
        - anomalous_sparse_baseline_flag
        - blocked_total_observations
        - blocked_count
        - blocked_rate
        - blocked_baseline_rate_12w
        - blocked_zscore_12w
        - blocked_low_sample_flag
        - blocked_sparse_baseline_flag
        - feature_version
      properties:
        week_start_date:
          type: string
          format: date
        test_name:
          type: string
        anomalous_total_scored:
          type: [integer, "null"]
        anomalous_count:
          type: [integer, "null"]
        anomalous_rate:
          type: [number, "null"]
        anomalous_baseline_rate_12w:
          type: [number, "null"]
        anomalous_zscore_12w:
          type: [number, "null"]
        anomalous_low_sample_flag:
          type: boolean
        anomalous_sparse_baseline_flag:
          type: boolean
        blocked_total_observations:
          type: integer
        blocked_count:
          type: integer
        blocked_rate:
          type: number
        blocked_baseline_rate_12w:
          type: [number, "null"]
        blocked_zscore_12w:
          type: [number, "null"]
        blocked_low_sample_flag:
          type: boolean
        blocked_sparse_baseline_flag:
          type: boolean
        feature_version:
          type: string
    OoniSupporting:
      type: object
      required: [kind, top_test, tests, note]
      properties:
        kind:
          const: ooni
        top_test:
          type: [string, "null"]
          description: |
            The test the headline is about; null when every `anomalous_zscore_12w` in
            the week is null.
        tests:
          type: array
          description: The anchor week's rows, one per test, sorted by `test_name`.
          items:
            $ref: "#/components/schemas/OoniTestWeek"
        note:
          type: string
          description: Fixed text on what these measurements can and cannot show.
          const: >-
            These OONI tests detect blocking of specific apps and sites. A general
            network shutdown produces no measurements, so it cannot show up as an
            anomaly here.
    GoogleTransparencyRow:
      type: object
      required:
        - requestor
        - product
        - reason
        - number_of_requests
        - items_requested_removal
        - items_removed_legal
        - items_removed_policy
      properties:
        requestor:
          type: string
        product:
          type: string
        reason:
          type: string
        number_of_requests:
          type: integer
        items_requested_removal:
          type: integer
        items_removed_legal:
          type: integer
        items_removed_policy:
          type: integer
    GoogleTransparencySupporting:
      type: object
      required: [kind, time_period, totals, rows]
      properties:
        kind:
          const: google_transparency
        time_period:
          type: string
          description: The half-year as Google labels it, e.g. "January - June 2024".
        totals:
          type: object
          description: The four count fields summed over `rows`.
          required:
            - number_of_requests
            - items_requested_removal
            - items_removed_legal
            - items_removed_policy
          properties:
            number_of_requests:
              type: integer
            items_requested_removal:
              type: integer
            items_removed_legal:
              type: integer
            items_removed_policy:
              type: integer
        rows:
          type: array
          description: Sorted by requestor, product, reason.
          items:
            $ref: "#/components/schemas/GoogleTransparencyRow"
    EvidenceCardResponse:
      type: object
      required: [snapshot_version, evidence]
      properties:
        snapshot_version:
          $ref: "#/components/schemas/SnapshotVersion"
        evidence:
          $ref: "#/components/schemas/EvidenceCard"
    RegimeStateDefinition:
      type: object
      required: [state, definition]
      properties:
        state:
          $ref: "#/components/schemas/RegimeState"
        definition:
          type: string
    SourceNote:
      type: object
      required: [source, name, note]
      x-provisional: true
      properties:
        source:
          $ref: "#/components/schemas/EvidenceSource"
        name:
          type: string
        note:
          type: string
          description: Collection method, grain and known limits of this source.
    SnapshotTable:
      type: object
      required: [file, source_table, sql, row_count, exported_at]
      properties:
        file:
          type: string
        source_table:
          type: string
        sql:
          type: string
          description: The exact SQL that produced this file.
        exported_at:
          type: string
          format: date-time
        row_count:
          type: integer
          minimum: 0
    SnapshotManifest:
      type: object
      required: [version, exported_at, tables]
      properties:
        version:
          $ref: "#/components/schemas/SnapshotVersion"
        exported_at:
          type: string
          format: date-time
        tables:
          type: array
          items:
            $ref: "#/components/schemas/SnapshotTable"
    MethodologyResponse:
      type: object
      required: [snapshot_version, regime_states, confidence_levels, family_bands, sources, manifest]
      properties:
        snapshot_version:
          $ref: "#/components/schemas/SnapshotVersion"
        regime_states:
          type: array
          items:
            $ref: "#/components/schemas/RegimeStateDefinition"
        confidence_levels:
          type: array
          description: Each confidence level and what it means.
          items:
            type: object
            required: [level, definition]
            properties:
              level:
                $ref: "#/components/schemas/ConfidenceLevel"
              definition:
                type: string
        family_bands:
          type: array
          description: Each family band and what it means.
          items:
            type: object
            required: [band, definition]
            properties:
              band:
                $ref: "#/components/schemas/FamilyBand"
              definition:
                type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceNote"
        manifest:
          $ref: "#/components/schemas/SnapshotManifest"
