apiVersion: 1

policies:
  - orgId: 1
    receiver: grafana-default-email
    group_by: [alertname]
    routes:
      - receiver: on-call-agent
        object_matchers:
          - [severity, "=", page]
        group_by: [alertname]
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 1h
