[project]
name = "clio-findings-backend"
version = "0.1.0"
description = "CLIO Findings Explorer backend: schema, migrations and seed"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]>=3",
    "pyyaml",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-instrumentation-psycopg==0.66b1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "openapi-core>=0.23.1",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: no database needed",
    "integration: needs the compose Postgres db service",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
