# Add once content/ exists:  docker compose -f docker-compose.yml -f docker-compose.content.yml run --rm seed
# (or set COMPOSE_FILE). Kept separate because a plain bind mount of a missing ./content would make
# Docker create that directory on the host; create_host_path: false fails instead of creating it.
services:
  seed:
    volumes:
      - type: bind
        source: ./content
        target: /content
        read_only: true
        bind:
          create_host_path: false
