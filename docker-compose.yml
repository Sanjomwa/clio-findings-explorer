# Phase 1b: database and seed only. The backend and frontend services arrive in later steps.
name: clio-findings-explorer

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  seed:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SNAPSHOT_DIR: /data/snapshot
      CONTENT_DIR: /content
    volumes:
      - ./data/snapshot:/data/snapshot:ro
    # alembic upgrade head, then the seed, then exit (the Dockerfile CMD).
    restart: "no"

volumes:
  pgdata:
