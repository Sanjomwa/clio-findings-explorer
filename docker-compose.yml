# db, seed, backend, frontend (built static files served by nginx), lgtm (Grafana, Tempo, Loki,
# Prometheus and an OTLP collector in one image; see docs/observability.md) and oncall (the alert
# webhook receiver, see docs/on-call.md).
name: clio-findings-explorer

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SNAPSHOT_DIR: /data/snapshot
      CONTENT_DIR: /content
    volumes:
      - ./data/snapshot:/data/snapshot:ro
      - ./content:/content:ro
    # alembic upgrade head, then the seed, then exit.
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CONTENT_DIR: /content
      # Export telemetry to lgtm. Not a depends_on: the API starts and serves with lgtm down.
      # Set OTEL_EXPORTER_OTLP_ENDPOINT to an empty string to export nothing (CI does).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://lgtm:4318}
      # Caps every OTLP export at 1 s, including the final flush at shutdown, so a stopping lgtm cannot hold the exit.
      OTEL_EXPORTER_OTLP_TIMEOUT: "1"
    volumes:
      - ./content:/content:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # The on-call webhook receiver (docs/on-call.md). It only receives: each alert Grafana posts is
  # written to ops/oncall/inbox/. The actor that reads the inbox runs on the host, never here.
  # No published port: only lgtm calls it, over the compose network.
  oncall:
    build: ./ops/oncall
    # The host user's uid:gid (1000:1000 on a default WSL install), so the inbox files are yours.
    user: "${ONCALL_UID:-1000}:${ONCALL_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./ops/oncall/inbox:/inbox
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s

  lgtm:
    image: grafana/otel-lgtm:0.37.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-change-me-local-only}
      # Anyone who can reach 127.0.0.1:3000 may view and explore. Provisioned dashboards cannot be saved over.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Viewers may use Explore (logs and traces link there) but still cannot save dashboards.
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      # Where the alert's webhook contact point posts: the oncall service above.
      ONCALL_WEBHOOK_URL: ${ONCALL_WEBHOOK_URL:-http://oncall:8090/alert}
    volumes:
      - ./ops/grafana/provisioning/dashboards/cfe.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/cfe.yaml:ro
      - ./ops/grafana/dashboards:/cfe-dashboards:ro
      - ./ops/grafana/provisioning/datasources/grafana-datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/grafana-datasources.yaml:ro
      - ./ops/grafana/provisioning/alerting/rules.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/cfe-rules.yaml:ro
      - ./ops/grafana/provisioning/alerting/contact-points.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/cfe-contact-points.yaml:ro
      - ./ops/grafana/provisioning/alerting/policies.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/cfe-policies.yaml:ro
    # Grafana only. The OTLP ports (4317, 4318) are reachable from other services, not published.
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
